name: FF2B Database

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test database migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ff2b_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d ff2b_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Sqitch
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            sqitch \
            libdbd-pg-perl \
            postgresql-client

      - name: Check Sqitch plan
        run: |
          sqitch plan

      - name: Deploy migrations
        env:
          PGPASSWORD: postgres
        run: |
          sqitch deploy \
            db:pg://postgres:postgres@localhost:5432/ff2b_test

      - name: Verify database
        env:
          PGPASSWORD: postgres
        run: |
          sqitch verify \
            db:pg://postgres:postgres@localhost:5432/ff2b_test

      - name: Check migration status
        env:
          PGPASSWORD: postgres
        run: |
          sqitch status \
            db:pg://postgres:postgres@localhost:5432/ff2b_test

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest

    # Production is only deployed after a merge/push to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - test

    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Sqitch
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            sqitch \
            libdbd-pg-perl \
            postgresql-client

      - name: Configure production target
        env:
          PROD_DB_HOST: ${{ secrets.PROD_DB_HOST }}
          PROD_DB_PORT: ${{ secrets.PROD_DB_PORT }}
          PROD_DB_NAME: ${{ secrets.PROD_DB_NAME }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}

        run: |
          sqitch config --local target.prod.uri \
            "db:pg://${PROD_DB_USER}:${PROD_DB_PASSWORD}@${PROD_DB_HOST}:${PROD_DB_PORT}/${PROD_DB_NAME}"

      - name: Check production status
        run: |
          sqitch status prod

      - name: Deploy migrations
        run: |
          sqitch deploy prod

      - name: Verify production database
        run: |
          sqitch verify prod

      - name: Check final status
        run: |
          sqitch status prod
