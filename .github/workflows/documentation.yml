name: Database Documentation

on:
  push:
    branches:
      - main

    paths:
      - "database/**"
      - "deploy/**"
      - "revert/**"
      - "verify/**"
      - "sqitch.conf"
      - "sqitch.plan"
      - ".github/workflows/docs.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build database documentation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ff2b
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ff2b"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres -d ff2b; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Initialize database
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -p 5432 \
            -U postgres \
            -d ff2b \
            -f database/schema.sql

      - name: Prepare documentation directory
        run: |
          rm -rf site
          mkdir -p site

      - name: Generate SchemaSpy documentation
        run: |
          docker run --rm \
            --user root \
            --network host \
            -v "${{ github.workspace }}/site:/output" \
            schemaspy/schemaspy:latest \
            -t pgsql \
            -host localhost \
            -port 5432 \
            -db ff2b \
            -u postgres \
            -p postgres \
            -schemas public

      - name: Check generated documentation
        run: |
          test -f site/public/index.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/public

  deploy:
    name: Deploy database documentation
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
